<!doctype html><meta charset="utf-8"><title>TypeNap focus animation verification</title><style>:root{--brand-accent:#E8890D;--tn-text:#D4CFBF;--font-family-content:Arial}body{background:#242424;color:white}.workspace { color: var(--tn-text); }
.badge { color: var(--tn-subtext); font-size: 12px; }
.body { flex: 1; min-height: 0; overflow: auto; padding: 8px 0 40px; }
.document { box-sizing: border-box; max-width: 900px; margin: auto; padding: 40px 48px; border: 1px solid var(--tn-stroke); border-radius: 22px; background: var(--tn-option-bg); }
.title, .summary { box-sizing: border-box; width: 100%; border: 0; background: transparent; color: var(--tn-text); font: inherit; }
.title { font-size: clamp(26px, 3vw, 36px); font-weight: 700; margin: 16px 0; }
.titleRow { display: flex; align-items: center; gap: 12px; }
.titleRow .title { min-width: 0; flex: 1; }
.characterIcon { flex-shrink: 0; color: var(--tn-text); }
.summary { resize: vertical; color: var(--tn-subtext); }
.section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
.section-count { color: var(--tn-subtext); font-size: 12px; }
.properties { margin: 36px 0; }
.section-heading h2 { margin: 0; font-size: 26px; }
.property { display: grid; grid-template-columns: minmax(90px, 30%) minmax(0, 1fr) 28px; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--tn-stroke); }
.property-label { padding-top: 7px; white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 700; }
.property-value { min-width: 0; }
.property-input { box-sizing: border-box; display: block; width: 100%; min-width: 0; padding: 7px 0; border: 0; background: transparent; color: var(--tn-text); font: inherit; line-height: 1.6; resize: none; overflow: hidden; overflow-wrap: anywhere; }
.property-input::placeholder { color: var(--tn-subtext); }
.workspace input, .workspace textarea {
  font-family: var(--font-family-content);
  font-weight: 400;
  border-radius: 0;
  box-shadow: 0 1px 0 transparent;
  transition: box-shadow 180ms ease-out;
}
.workspace input:focus, .workspace textarea:focus { outline: none !important; box-shadow: 0 1px 0 var(--brand-accent); }
.workspace button:focus-visible { outline: 2px solid var(--tn-focus); outline-offset: 3px; }
.string-list { display: grid; gap: 2px; }
.list-item { display: flex; align-items: flex-start; gap: 8px; }
.list-item .property-input { flex: 1; }
.quiet-action { display: grid; place-items: center; width: 28px; height: 28px; margin-top: 5px; border: 0; border-radius: 8px; background: transparent; color: var(--tn-subtext); cursor: pointer; }
.quiet-action:hover { color: var(--tn-text); background: var(--tn-stroke); }
.property-delete { opacity: 0; }
.property:hover .property-delete, .property:focus-within .property-delete { opacity: 1; }
.list-add { display: flex; align-items: center; gap: 6px; padding: 6px 0; background: transparent; border: 0; color: var(--tn-subtext); font: inherit; font-size: 13px; cursor: pointer; }
.list-add:hover { color: var(--tn-text); }
.list-add:disabled { opacity: .4; cursor: default; }
.list-empty { padding: 7px 0; color: var(--tn-subtext); font-size: 13px; }
.property-add-area { margin-top: 24px; }
.property-create { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 28px; gap: 12px; }
.property-error { color: #dc8070; }
@media (max-width: 760px) { .document { padding: 24px; } .property { grid-template-columns: minmax(65px, 30%) minmax(0, 1fr) 24px; gap: 10px; } .property-create { grid-template-columns: minmax(0, 1fr) auto 28px; } .property-create > .property-input { grid-column: 1 / -1; } }
@media (hover: none) { .property-delete { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  /* Keep this non-spatial focus cue brief, without disabling it entirely. */
  .workspace input, .workspace textarea { transition-duration: 80ms; }
}
/* Windows contrast themes suppress shadows; use the OS highlight instead. */
@media (forced-colors: active) {
  .workspace input, .workspace textarea {
    box-shadow: none;
    transition: none;
    border-bottom: 1px solid transparent;
  }
  .workspace input:focus, .workspace textarea:focus {
    box-shadow: none;
    border-bottom-color: Highlight;
  }
}


</style><div class="workspace"><input id="field" value="Focus verification"></div><pre id="result">Checking...</pre><script>
(async()=>{
const field=document.getElementById('field');
const result={reduced:matchMedia('(prefers-reduced-motion: reduce)').matches,forced:matchMedia('(forced-colors: active)').matches,duration:getComputedStyle(field).transitionDuration,before:getComputedStyle(field).boxShadow};
const events=[];field.addEventListener('transitionrun',e=>events.push('run:'+e.propertyName));field.addEventListener('transitionend',e=>events.push('end:'+e.propertyName));
await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));field.focus();
await new Promise(r=>setTimeout(r,30));result.middle=getComputedStyle(field).boxShadow;
await new Promise(r=>setTimeout(r,220));result.after=getComputedStyle(field).boxShadow;result.events=events;result.passed=events.includes('end:box-shadow')&&result.middle!==result.before&&result.middle!==result.after;
document.getElementById('result').textContent=JSON.stringify(result,null,2);
})();</script>
